name: Verify public AirAware deployment URLs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_public_urls.py'
      - 'scripts/check_deployment.py'
      - 'tests/test_public_urls_verification.py'
      - '.github/workflows/public-release-monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  public-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STATIC_DEMO_URL: https://harshakavali81-collab.github.io/AirAware-AI-Air-Pollution-Heat-Risk-Intelligence/
      FULLSTACK_URL: ${{ vars.AIRAWARE_FULLSTACK_URL }}
      REQUIRE_LIVE: ${{ vars.AIRAWARE_REQUIRE_LIVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Verify independent public endpoints
        run: |
          args=(--demo-url "$STATIC_DEMO_URL")
          if [ -n "$FULLSTACK_URL" ]; then
            args+=(--fullstack-url "$FULLSTACK_URL")
            if [ "$REQUIRE_LIVE" = 'true' ]; then args+=(--require-live); fi
          fi
          python -m scripts.verify_public_urls "${args[@]}" | tee public-verification.json
          echo '### Public deployment verification' >> "$GITHUB_STEP_SUMMARY"
          echo '* Static synthetic demo: HTTP content, product branding and disclosure checked.' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$FULLSTACK_URL" ]; then
            echo '* Full-stack hosting: **NOT CONFIGURED**, not counted as deployed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '* Full-stack hosting: checked configured URL (live-source check only if explicitly requested).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airaware-public-release-verification
          path: public-verification.json
          if-no-files-found: ignore
          retention-days: 14
