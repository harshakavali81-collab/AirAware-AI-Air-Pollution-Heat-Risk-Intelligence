name: Historical Observed PM2.5 Benchmark (Beijing, not live India)
on:
  push:
    paths:
      - 'scripts/uci_beijing_benchmark.py'
      - 'src/airaware/models/**'
      - 'src/airaware/processing/**'
      - '.github/workflows/historical-observation-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uci-historical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download official UCI archive; evaluate past held-out calendar windows
        run: python -m scripts.uci_beijing_benchmark --download-official --output reports/uci_beijing_historical.json
      - name: Print actual held-out metrics and provenance to workflow log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/uci_beijing_historical.json').read_text())
          print('EVIDENCE: Official UCI historical Beijing observations, not Hyderabad, not current air-quality')
          print('Source kind:', r['source_kind'])
          print('Archive SHA256:', r['archive_sha256'])
          print('Source hourly rows:',r['input']['source_hourly_rows'])
          print('Stations:',r['input']['stations'],'Folds:',r['fold_count'])
          print('Historical held-out MAE (µg/m³):',r['mean_fold_mae'])
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## UCI Beijing historical benchmark (2013–2017, **not live India**)\n\n')
              f.write(f"Source: {r['dataset']['doi']}; stations: {r['input']['stations']}; folds: {r['fold_count']}\n\n")
              f.write(f"Persistence MAE: **{r['mean_fold_mae']['persistence']} µg/m³**, Random Forest MAE: **{r['mean_fold_mae']['random_forest']} µg/m³**\n\n")
              f.write('Caution: historical out-of-time comparison, not validated current forecast performance.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uci-beijing-historical-evaluation
          path: reports/uci_beijing_historical.json
          retention-days: 30
