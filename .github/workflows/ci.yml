name: Verify Python and React
on:
  push:
  pull_request:
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q backend src
      - name: Verify Power BI PBIP source integrity (not Desktop)
        run: python -m scripts.verify_powerbi_project
  build-ui:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build

  build-fullstack-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production React + API image
        run: docker build --progress=plain -t airaware-ci .
      - name: Verify fullstack health and homepage
        run: |
          docker run -d --name airaware-ci-check -p 8000:8000 airaware-ci
          for n in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /tmp/airaware-health.json; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | grep -qi '<html'
          docker rm -f airaware-ci-check
