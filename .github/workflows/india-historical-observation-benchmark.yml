name: Historical Hyderabad CPCB PM2.5 backtest (not live OpenAQ)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/india_cpcb_historical_benchmark.py'
      - 'src/airaware/models/rolling_backtest.py'
      - 'src/airaware/processing/**'
      - '.github/workflows/india-historical-observation-benchmark.yml'
permissions:
  contents: read
jobs:
  india-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download attributed historical CPCB Hyderabad observations from XKDR and backtest
        run: python -m scripts.india_cpcb_historical_benchmark --download-xkdr-2024 --output reports/hyderabad_cpcb_historical_2024.json
      - name: Show real source, coverage and per-model results (no health or future accuracy claims)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('reports/hyderabad_cpcb_historical_2024.json').read_text())
          assert r['source_kind']=='xkdr_historical_cpcb_observations'
          print('Historical observed Hyderabad 2024; NOT live OpenAQ or validated operational forecast')
          print('Data source:',r['dataset']['source'])
          print('Rows:',r['input']['valid_daily_station_rows'],'station count:',r['input']['stations'])
          print('First/last:',r['input']['first_date'],r['input']['last_date'])
          print('Source SHA256:',r['source_csv_sha256'])
          print('Mean-fold MAE µg/m³:',r['mean_fold_mae'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a', encoding='utf-8') as f:
              f.write('## Recorded-source Hyderabad PM2.5, calendar 2024 (not live data)\n\n')
              f.write('XKDR Forum / CPCB CAAQM, CC BY 4.0 compilation. No medical/regulatory implications.\n\n')
              f.write(f"Sites: **{r['input']['stations']}**, observed days: **{r['observed_days']}**, folds: **{r['fold_count']}**.\n\n")
              f.write(f"Persistence MAE: **{r['mean_fold_mae']['persistence']} µg/m³**; Random Forest MAE: **{r['mean_fold_mae']['random_forest']} µg/m³**.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyderabad-cpcb-2024-historical-evaluation
          path: reports/hyderabad_cpcb_historical_2024.json
          retention-days: 30
