services:
  api:
    build: .
    environment:
      AIR_DATA_MODE: ${AIR_DATA_MODE:-demo}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      DATABASE_PATH: /app/data/processed/airaware.db
    volumes:
      - airaware-db:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  airaware-db:
