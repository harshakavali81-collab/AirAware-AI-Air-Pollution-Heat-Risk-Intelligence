[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "airaware-ai"
version = "1.0.0"
description = "Environmental air-quality and heat-exposure intelligence demo with real-data connectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.28,<1", "httpx>=0.27,<1", "pandas>=2,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1", "matplotlib>=3.8,<4"]
[tool.setuptools.packages.find]
include = ["src*", "backend*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
